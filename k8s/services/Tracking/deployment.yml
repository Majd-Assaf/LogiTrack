apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackingservice
  namespace: logitrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trackingservice
  template:
    metadata:
      labels:
        app: trackingservice
    spec:
      containers:
      - name: trackingservice
        image: logitrack/tracking.worker:latest
        imagePullPolicy: Never

        ports:
        - containerPort: 8080
        env:
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: logitrack-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: logitrack-secret
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: logitrack-secret
              key: RABBITMQ_PASSWORD
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z rabbitmq.logitrack.svc.cluster.local 5672; do echo waiting for rabbitmq; sleep 2; done;']