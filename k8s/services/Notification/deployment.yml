apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificationservice
  namespace: logitrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notificationservice
  template:
    metadata:
      labels:
        app: notificationservice
    spec:
      containers:
      - name: notificationservice
        image: logitrack/notification.worker:latest
        imagePullPolicy: Never

        ports:
        - containerPort: 8080
        env:
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: logitrack-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: logitrack-secret
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: logitrack-secret
              key: RABBITMQ_PASSWORD
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z rabbitmq.logitrack.svc.cluster.local 5672; do echo waiting for rabbitmq; sleep 2; done;']